model:
  variant: B5
  backbone: ViT-L-14-quickgelu
  pretrained: openai
  hidden_dim: 512
  slots: 8
training:
  epochs: 5
  batch_size_per_device: 16
  learning_rate: 0.0001
  weight_decay: 0.1
  precision: amp
  seed: 0
  num_workers: 2
  save_every_steps: 100
  max_grad_norm: 1.0
  cf_margin: 0.2
  loss_weights: {factorization: 0.2, counterfactual: 1.0, verifier: 0.5}
data:
  train_manifest: data/pseudo_edits/train.csv
  image_root: data/cc_data/train
  max_samples: null
output:
  run_dir: runs/B5_seed0
