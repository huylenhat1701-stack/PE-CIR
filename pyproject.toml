[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pic2word"
version = "0.2.0"
description = "Pic2Word baseline for PE-CIR experiments"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "open-clip-torch>=2.24", "pillow>=10", "pyyaml>=6", "torch>=2.3", "torchvision>=0.18"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
